# Home Assistant Connect AUX-2 test firmware: USB audio on a UAC 2.0 host driver.
#
# Audio Output selector: Analog (DAC), Digital (TOSLink) or USB. USB input as a Sendspin source, plus
# connection, status and level sensors for both directions (usb-audio.yaml).
# Works with UAC 2.0 devices that run at full speed (Apple USB-C to 3.5 mm adapter, 05ac:110a).
# UAC 1.0-only devices (e.g. Sound BlasterX G6) are ignored by this build; use aux-2-usb-audio-uac1.yaml.
#
# Needs ESPHome dev (2026.11.0-dev or later), see README.md.

packages:
  # Upstream AUX-2 core package, pinned to the commit this was put together against.
  core: github://NabuCasa/aux-2/packages/aux-2.yaml@d30ca0b96561a18c3d3ffb6d25ae17b77208c957
  # No Bluetooth, no ZWA-2 / ZBT-2 / USB RS-485 (Modbus); router and selector replaced by usb_audio's.
  trim: !include trim.yaml
  usb_audio: !include
    file: usb-audio.yaml
    vars:
      driver: uac2   # averyy/usb_host_uac2 0.2.0 from the ESP component registry

# From packages/factory.yaml, minus signed OTA and the update channel (those need the
# signing keys) and BLE Improv (no Bluetooth). Provision over USB serial (Improv) or the AP.
improv_serial:
  id: improv_serial_component

provisioning:
  timeout: 15min
