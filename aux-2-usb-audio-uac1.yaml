# Home Assistant Connect AUX-2 test firmware: USB audio on Espressif's UAC 1.0 driver (upstream usb_audio
# behaviour). Regression build for UAC 1.0 devices such as the Sound BlasterX G6 (041e:3256).
#
# Same features as the UAC2 build (usb-audio.yaml): Audio Output selector with USB, USB input as a Sendspin
# source, connection/status/level sensors.
#
# Uses this repo's patched espressif/usb_host_uac 1.5.0, which fixes the crash in uac_host_device_open()'s
# error path when a device is rejected (e.g. a UAC 2.0 device plugged into a UAC1 build).
#
# Needs ESPHome dev (2026.11.0-dev or later), see README.md.

packages:
  core: github://NabuCasa/aux-2/packages/aux-2.yaml@d30ca0b96561a18c3d3ffb6d25ae17b77208c957
  trim: !include trim.yaml
  usb_audio: !include
    file: usb-audio.yaml
    vars:
      driver: uac1

esp32:
  framework:
    components:
      - name: espressif/usb_host_uac
        source: https://github.com/googanhiem/aux-2-usb-audio-uac2.git
        ref: main
        path: idf_components/usb_host_uac

# No BLE Improv (no Bluetooth); provision over USB serial (Improv) or the AP.
improv_serial:
  id: improv_serial_component

provisioning:
  timeout: 15min
